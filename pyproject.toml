[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shopsense"
version = "0.4.0"
description = "ShopSense AI - retail intelligence and real-time data platform"
requires-python = ">=3.11"
# Runtime dependencies for the AWS Glue jobs (Glue already provides Spark, pandas and numpy).
# The full local environment is pinned in requirements.txt.
dependencies = [
    "universal-pathlib>=0.3",
    "s3fs>=2024.1",
    "pyarrow>=14",
]

[tool.setuptools.packages.find]
include = ["shopsense*"]

